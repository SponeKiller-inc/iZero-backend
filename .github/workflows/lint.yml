name: Python Lint test

on:
  pull_request:  
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install ruff package
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint check via ruff
        run: |
          ruff check.
